<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS-POPUP</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>স্বাগতম</h1>
      <p>এখানে স্ক্রল করুন এবং কনটেন্ট উপভোগ করুন।</p>
    </div>

    <!-- Popup Modal -->
    <div id="popup-overlay" class="overlay hidden">
      <div class="popup-card">
        <button id="close-btn" class="close-btn">&times;</button>
        <h2 id="popup-title">বিশেষ ঘোষণা! </h2>
        <p id="popup-text">এখানে মজার মেসেজ দেখাবে...</p>
        <button id="action-btn" class="action-btn">ঠিক আছে, মাফ চাই!</button>
      </div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
